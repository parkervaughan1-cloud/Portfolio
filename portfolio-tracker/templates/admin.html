{% extends "base.html" %}
{% block title %}Portfolio Admin{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="section-heading admin-heading">
      <div>
        <div class="eyebrow">ADMIN</div>
        <h1>Project manager</h1>
      </div>
      <div class="admin-actions">
        <a class="button ghost" href="{{ url_for('site_settings') }}">Edit homepage</a>
        <a class="button primary" href="{{ url_for('new_project') }}">+ New project</a>
      </div>
    </div>

    <div class="admin-list">
      {% for project in projects %}
        <div class="admin-row">
          <div>
            <strong>{{ project.title }}</strong>
            <div class="muted">{{ project.summary }}</div>
          </div>
          <div class="admin-actions">
            <a class="button ghost small-btn" href="{{ url_for('project_detail', slug=project.slug) }}">View</a>
            <a class="button ghost small-btn" href="{{ url_for('edit_project', project_id=project.id) }}">Edit</a>
            <form method="post" action="{{ url_for('delete_project', project_id=project.id) }}" onsubmit="return confirm('Delete this project?');">
              <button class="button danger small-btn">Delete</button>
            </form>
          </div>
        </div>
      {% else %}
        <div class="empty-state"><p>No projects yet.</p></div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
